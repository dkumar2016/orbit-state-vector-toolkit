[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-state-vector-toolkit"
version = "0.1.0"
description = "Orbital elements <-> state vectors, Kepler's equation, with tests"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["toolkit"]